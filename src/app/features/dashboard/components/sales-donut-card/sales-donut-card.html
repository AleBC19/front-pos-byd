<div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <h2 class="text-base font-semibold text-gray-900">{{ title() }}</h2>

  <div class="mt-3 flex items-center gap-3">
    <div class="relative h-[90px] w-[90px] shrink-0">
      <canvas #donutCanvas></canvas>
    </div>

    <ul class="min-w-0 flex-1 space-y-2">
      @for (item of items(); track item.label) {
        <li class="flex items-center gap-1.5 text-sm">
          <span class="h-2.5 w-2.5 shrink-0 rounded-sm" [style.background-color]="item.color"></span>
          <span class="min-w-0 flex-1 truncate text-gray-700">{{ item.label }}</span>
          <span class="w-9 shrink-0 text-right text-gray-500">{{ item.percent }}</span>
          <span class="w-[64px] shrink-0 text-right font-medium text-gray-900">{{ item.amount }}</span>
        </li>
      }
    </ul>
  </div>
</div>
