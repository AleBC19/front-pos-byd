<div class="flex h-full flex-col rounded-xl border border-gray-200 bg-white shadow-sm">
  <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3">
    <h2 class="text-base font-semibold text-gray-900">Alertas</h2>
    <span
      class="flex h-5 w-5 items-center justify-center rounded-full bg-red-500 text-sm font-bold text-white"
    >
      {{ totalAlerts }}
    </span>
  </div>

  <ul class="flex-1 divide-y divide-gray-100 px-4">
    @for (alert of alerts; track alert.code) {
      <li class="flex items-center gap-2 py-2.5">
        <!-- Placeholder de imagen del producto -->
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-gray-200 bg-gray-50 text-gray-300">
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="m2.25 15.75 5.16-5.16a2.25 2.25 0 0 1 3.18 0l5.16 5.16m-1.5-1.5 1.41-1.41a2.25 2.25 0 0 1 3.18 0l2.91 2.91M3.75 19.5h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm12.75-12h.01"
            />
          </svg>
        </span>

        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-gray-900">{{ alert.name }}</p>
          <p class="text-sm text-gray-500">Código: {{ alert.code }}</p>
        </div>

        <span
          class="shrink-0 text-xs font-semibold"
          [class]="alert.severity === 'critical' ? 'text-red-600' : 'text-orange-500'"
        >
          Stock: {{ alert.stock }}
        </span>

        <button
          type="button"
          class="shrink-0 rounded-md border border-blue-600 px-1.5 py-1 text-xs font-medium text-blue-600 transition-colors hover:bg-blue-50"
        >
          Reabastecer
        </button>
      </li>
    }
  </ul>

  <div class="border-t border-gray-100 px-4 py-3">
    <button type="button" class="flex items-center gap-1 text-sm font-medium text-blue-600 hover:underline">
      Ver todas las alertas
      <svg
        class="h-3.5 w-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M13.5 4.5 21 12l-7.5 7.5M21 12H3" />
      </svg>
    </button>
  </div>
</div>
