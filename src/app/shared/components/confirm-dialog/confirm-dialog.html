<app-modal [(open)]="open" [title]="title()" size="sm">
  <div class="space-y-4">
    <p class="text-base text-gray-600">{{ message() }}</p>

    <div class="flex justify-end gap-2">
      <button
        type="button"
        (click)="open.set(false)"
        class="rounded-lg border border-gray-200 px-4 py-2 text-base font-medium text-gray-600 transition-colors hover:bg-gray-50"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        (click)="confirm()"
        class="rounded-lg bg-blue-600 px-4 py-2 text-base font-medium text-white transition-colors hover:bg-blue-700"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</app-modal>
