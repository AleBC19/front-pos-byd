<div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <h2 class="text-base font-semibold text-gray-900">Inventario</h2>

  <div class="mt-3 grid grid-cols-3 gap-3">
    <div class="rounded-lg border border-blue-100 bg-blue-50 p-3">
      <span class="flex h-7 w-7 items-center justify-center rounded-md bg-white text-blue-600">
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12 6v12m-3-2.82c.55.55 1.8.94 3 .94 1.79 0 3-.84 3-2.06 0-2.97-5.78-1.4-5.78-4.12C9.22 8.84 10.32 8 12 8c1.2 0 2.45.39 3 .94"
          />
        </svg>
      </span>
      <p class="mt-2 text-sm text-gray-600">Valor inventario</p>
      <p class="text-base font-bold text-gray-900">{{ summary().value }}</p>
      <p class="mt-0.5 text-xs text-gray-500">{{ summary().valueUpdatedAt }}</p>
    </div>

    <div class="rounded-lg border border-orange-100 bg-orange-50 p-3">
      <span class="flex h-7 w-7 items-center justify-center rounded-md bg-white text-orange-500">
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12 9v3.75m0 3h.01M3.7 19.5h16.6c1.16 0 1.88-1.25 1.3-2.25L13.3 4.5a1.5 1.5 0 0 0-2.6 0L2.4 17.25c-.58 1-.14 2.25 1.3 2.25Z"
          />
        </svg>
      </span>
      <p class="mt-2 text-sm text-gray-600">Productos bajo stock</p>
      <p class="text-base font-bold text-gray-900">{{ summary().lowStock }}</p>
      <p class="mt-0.5 text-xs text-gray-500">Requieren atención</p>
    </div>

    <div class="rounded-lg border border-red-100 bg-red-50 p-3">
      <span class="flex h-7 w-7 items-center justify-center rounded-md bg-white text-red-500">
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9.75 9.75 14.25 14.25m0-4.5L9.75 14.25M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      </span>
      <p class="mt-2 text-sm text-gray-600">Productos agotados</p>
      <p class="text-base font-bold text-gray-900">{{ summary().outOfStock }}</p>
      <p class="mt-0.5 text-xs text-gray-500">Sin existencias</p>
    </div>
  </div>
</div>
