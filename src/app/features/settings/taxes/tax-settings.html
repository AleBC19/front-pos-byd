<article class="rounded-xl border border-gray-200 bg-white shadow-sm">
  <header class="flex items-center gap-3 border-b border-gray-200 px-5 py-4">
    <svg
      class="h-8 w-8 text-gray-700"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m8.25 15.75 7.5-7.5M9 9.75h.01M15 14.25h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>
    <div>
      <h2 class="text-xl font-semibold text-gray-900">Impuestos</h2>
      <p class="text-sm text-gray-500">
        Configura los impuestos aplicados a tus productos y ventas.
      </p>
    </div>
  </header>

  <div class="max-w-4xl divide-y divide-gray-100 px-5">
    <div class="flex items-center justify-between py-5">
      <div>
        <p class="text-base font-medium text-gray-900">Aplicar impuestos</p>
        <p class="mt-0.5 text-sm text-gray-500">Calcula impuestos en las ventas realizadas.</p>
      </div>
      <button
        type="button"
        role="switch"
        [attr.aria-checked]="enabled()"
        (click)="enabled.set(!enabled()); markChanged()"
        [class.bg-blue-600]="enabled()"
        [class.bg-gray-300]="!enabled()"
        class="relative h-6 w-11 rounded-full transition-colors"
      >
        <span
          [class.translate-x-5]="enabled()"
          [class.translate-x-0.5]="!enabled()"
          class="absolute top-0.5 left-0 h-5 w-5 rounded-full bg-white shadow transition-transform"
        ></span>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-5 py-5">
      <label class="block text-sm font-medium text-gray-700">
        Impuesto predeterminado
        <select
          [disabled]="!enabled()"
          class="mt-1.5 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-base text-gray-900 outline-none disabled:bg-gray-100 disabled:text-gray-400 focus:border-blue-500"
        >
          <option>IVA</option>
        </select>
      </label>
      <label class="block text-sm font-medium text-gray-700">
        Tasa de IVA
        <span class="relative mt-1.5 block">
          <input
            type="number"
            min="0"
            max="100"
            [disabled]="!enabled()"
            [value]="rate()"
            (input)="rate.set($any($event.target).value); markChanged()"
            class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 pr-10 text-base text-gray-900 outline-none disabled:bg-gray-100 disabled:text-gray-400 focus:border-blue-500"
          />
          <span class="absolute top-1/2 right-3 -translate-y-1/2 text-gray-500">%</span>
        </span>
      </label>
    </div>

    <div class="flex items-center justify-between py-5">
      <div>
        <p class="text-base font-medium text-gray-900">Precios con impuestos incluidos</p>
        <p class="mt-0.5 text-sm text-gray-500">
          Los precios capturados ya incluyen el IVA configurado.
        </p>
      </div>
      <button
        type="button"
        role="switch"
        [disabled]="!enabled()"
        [attr.aria-checked]="includedInPrices()"
        (click)="includedInPrices.set(!includedInPrices()); markChanged()"
        [class.bg-blue-600]="includedInPrices() && enabled()"
        [class.bg-gray-300]="!includedInPrices() || !enabled()"
        class="relative h-6 w-11 rounded-full transition-colors disabled:opacity-60"
      >
        <span
          [class.translate-x-5]="includedInPrices()"
          [class.translate-x-0.5]="!includedInPrices()"
          class="absolute top-0.5 left-0 h-5 w-5 rounded-full bg-white shadow transition-transform"
        ></span>
      </button>
    </div>
  </div>

  <footer class="flex items-center justify-end gap-3 border-t border-gray-200 px-5 py-4">
    @if (saved()) {
      <span role="status" class="text-sm font-medium text-green-600"
        >Cambios guardados localmente</span
      >
    }
    <button
      type="button"
      (click)="save()"
      class="rounded-lg bg-blue-600 px-5 py-2.5 text-base font-medium text-white hover:bg-blue-700"
    >
      Guardar cambios
    </button>
  </footer>
</article>
