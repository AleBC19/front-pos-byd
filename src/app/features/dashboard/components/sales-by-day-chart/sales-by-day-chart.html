<div class="flex h-full flex-col rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-4">
      <h2 class="text-base font-semibold text-gray-900">Ventas por día</h2>
      <span class="flex items-center gap-1.5 text-sm text-gray-600">
        <span class="h-2.5 w-2.5 rounded-sm bg-blue-500"></span>
        Ventas ($)
      </span>
      <span class="flex items-center gap-1.5 text-sm text-gray-600">
        <span class="h-0.5 w-4 rounded bg-blue-800"></span>
        Tickets
      </span>
    </div>
    <p class="text-sm text-gray-600">
      Total ventas: <span class="font-semibold text-gray-900">{{ data().total }}</span>
    </p>
  </div>

  <div class="relative mt-3 min-h-[220px] flex-1">
    <canvas #chartCanvas></canvas>
  </div>
</div>
