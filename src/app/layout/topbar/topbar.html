<header class="flex items-center justify-end gap-4 px-4 py-3">
  <!-- Estado de sesión -->
  <div class="flex items-center gap-4">
    <!-- Caja activa -->
    <button
      type="button"
      class="flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-3 py-1.5 shadow-sm transition-colors hover:bg-gray-50"
    >
      <svg
        class="h-5 w-5 text-gray-600"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M5.25 10.5h13.5l1.5 7.5a1.1 1.1 0 0 1-1.08 1.32H4.83a1.1 1.1 0 0 1-1.08-1.32l1.5-7.5Zm3-3.75h7.5m-7.5 0V4.88c0-.62.5-1.13 1.13-1.13h5.24c.62 0 1.13.5 1.13 1.13v1.87"
        />
      </svg>
      <span class="text-left">
        <span class="block text-xs leading-3 text-gray-500">Caja activa</span>
        <span class="block text-sm font-semibold text-gray-900">
          @if (currentSession(); as session) {
            Turno #{{ session.id }} · Abierto
          } @else {
            Sin turno
          }
        </span>
      </span>
      <svg
        class="h-4 w-4 text-gray-400"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m19.5 8.25-7.5 7.5-7.5-7.5" />
      </svg>
    </button>

    <!-- Usuario -->
    <div class="flex items-center gap-2">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-blue-600">
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0"
          />
        </svg>
      </span>
      <span>
        <span class="block text-sm leading-4 font-semibold text-gray-900">{{ currentUser()?.name }}</span>
        <span class="block text-sm leading-3 text-gray-500">{{ currentUser()?.role }}</span>
      </span>
    </div>

    <!-- Notificaciones -->
    <button
      type="button"
      class="relative rounded-full p-1.5 text-gray-600 transition-colors hover:bg-gray-100"
      aria-label="Notificaciones"
    >
      <svg
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M14.85 17.66a24.3 24.3 0 0 0 5.4-1.21 8.97 8.97 0 0 1-2.25-5.96V9.75a6 6 0 0 0-12 0v.74c0 2.25-.84 4.4-2.25 5.96a24.3 24.3 0 0 0 5.4 1.21m5.7 0a24.55 24.55 0 0 1-5.7 0m5.7 0a2.85 2.85 0 1 1-5.7 0"
        />
      </svg>
      @if (notificationCount() > 0) {
        <span
          class="absolute -top-0.5 -right-0.5 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-xs font-bold text-white"
        >
          {{ notificationCount() }}
        </span>
      }
    </button>

    <!-- Fecha y hora -->
    <div class="text-right">
      <p class="text-sm font-semibold text-gray-900">{{ now() | date: 'dd/MM/yyyy' }}</p>
      <p class="text-sm text-gray-500">{{ now() | date: 'hh:mm a' }}</p>
    </div>
  </div>
</header>
