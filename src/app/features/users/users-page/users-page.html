<div class="space-y-4 pt-4">
  <!-- Encabezado -->
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="flex items-center gap-3">
      <svg
        class="h-9 w-9 text-blue-600"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M15 19.13v-1.5a4.13 4.13 0 0 0-4.12-4.13H5.63A4.13 4.13 0 0 0 1.5 17.63v1.5M18 8.25v6m3-3h-6m-4.5-3.38a3.38 3.38 0 1 1-6.75 0 3.38 3.38 0 0 1 6.75 0Z" />
      </svg>
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Usuarios y permisos</h1>
        <p class="text-base text-gray-500">Administra usuarios, roles y permisos del sistema</p>
      </div>
    </div>

    <button
      type="button"
      (click)="openCreate()"
      class="flex items-center gap-1.5 rounded-lg bg-blue-600 px-4 py-2 text-base font-medium text-white transition-colors hover:bg-blue-700"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Nuevo usuario
    </button>
  </div>

  <!-- Barra de tabs -->
  <div class="flex gap-6 border-b border-gray-200">
    <button
      type="button"
      (click)="setTab('users')"
      class="-mb-px border-b-2 px-1 pb-2.5 text-base font-medium transition-colors"
      [class]="
        activeTab() === 'users'
          ? 'border-blue-600 text-blue-600'
          : 'border-transparent text-gray-500 hover:text-gray-700'
      "
    >
      Usuarios
    </button>
    <button
      type="button"
      (click)="setTab('roles')"
      class="-mb-px border-b-2 px-1 pb-2.5 text-base font-medium transition-colors"
      [class]="
        activeTab() === 'roles'
          ? 'border-blue-600 text-blue-600'
          : 'border-transparent text-gray-500 hover:text-gray-700'
      "
    >
      Roles y permisos
    </button>
    <button
      type="button"
      (click)="setTab('recent')"
      class="-mb-px border-b-2 px-1 pb-2.5 text-base font-medium transition-colors"
      [class]="
        activeTab() === 'recent'
          ? 'border-blue-600 text-blue-600'
          : 'border-transparent text-gray-500 hover:text-gray-700'
      "
    >
      Accesos recientes
    </button>
  </div>

  <!-- Contenido de la tab activa -->
  @switch (activeTab()) {
    @case ('users') {
      <app-user-list (editUser)="openEdit($event)" />
    }
    @case ('roles') {
      <app-roles-permissions />
    }
    @case ('recent') {
      <app-recent-access />
    }
  }
</div>

<!-- Panel lateral de alta/edición de usuario -->
<app-side-panel [(open)]="panelOpen" [title]="panelTitle()" width="max-w-[560px]">
  <app-user-form [user]="editingUser()" (saved)="onSaved()" (cancelled)="closePanel()" />
</app-side-panel>
