<div class="rounded-xl border border-gray-200 bg-white shadow-sm">
  <!-- Encabezado de la sección + selector de rol -->
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-100 px-4 py-3">
    <div class="flex items-center gap-2">
      <svg
        class="h-5 w-5 text-blue-600"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M15 19.13v-1.5a4.13 4.13 0 0 0-4.12-4.13H5.63A4.13 4.13 0 0 0 1.5 17.63v1.5M18 8.25v6m3-3h-6m-4.5-3.38a3.38 3.38 0 1 1-6.75 0 3.38 3.38 0 0 1 6.75 0Z" />
      </svg>
      <h2 class="text-lg font-semibold text-gray-900">Permisos por rol</h2>
    </div>

    <div class="flex items-center gap-2">
      <label class="text-sm font-medium text-gray-500">Rol</label>
      <select
        (change)="onRoleChange($any($event.target).value)"
        class="min-w-[160px] rounded-lg border border-gray-200 px-2.5 py-2 text-base text-gray-600 focus:border-blue-500 focus:outline-none"
      >
        @for (role of roles(); track role.id) {
          <option [value]="role.id" [selected]="role.id === selectedRoleId()">{{ role.name }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Tabla de permisos -->
  <div class="overflow-x-auto">
    <table class="w-full text-left text-base">
      <thead>
        <tr class="border-b border-gray-100 text-base text-gray-500">
          <th class="px-4 py-2.5 font-medium">Permiso</th>
          <th class="px-3 py-2.5 font-medium">Descripción</th>
          <th class="px-4 py-2.5 text-center font-medium">{{ selectedRole()?.name }}</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        @for (permission of permissions(); track permission.code) {
          <tr class="transition-colors hover:bg-gray-50">
            <td class="px-4 py-2.5">
              <div class="flex items-center gap-2 font-medium text-gray-900">
                <svg
                  class="h-5 w-5 text-gray-400"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path [attr.d]="iconFor(permission.code)" />
                </svg>
                {{ permission.name }}
              </div>
            </td>
            <td class="px-3 py-2.5 text-gray-600">{{ permission.description }}</td>
            <td class="px-4 py-2.5">
              <div class="flex justify-center">
                <button
                  type="button"
                  role="switch"
                  [attr.aria-checked]="isEnabled(permission.code)"
                  [attr.aria-label]="permission.name"
                  class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                  [class]="isEnabled(permission.code) ? 'bg-green-500' : 'bg-gray-300'"
                >
                  <span
                    class="inline-block h-4 w-4 rounded-full bg-white transition-transform"
                    [class]="isEnabled(permission.code) ? 'translate-x-6' : 'translate-x-1'"
                  ></span>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
