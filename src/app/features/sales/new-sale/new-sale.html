<div class="flex min-h-0 flex-1 flex-col py-4">
  <!-- Barra superior: acceso a ventas en espera -->
  <div class="flex shrink-0 items-center justify-between pb-3">
    <h1 class="text-3xl font-bold text-gray-900">Nueva venta</h1>
    <button
      type="button"
      (click)="openHeld()"
      class="relative flex items-center gap-2 rounded-lg border border-gray-200 px-4 py-2 text-base font-medium text-gray-600 transition-colors hover:bg-gray-50"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6v6l4 2m6-2a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z" />
      </svg>
      Ventas en espera
      @if (heldCount() > 0) {
        <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-amber-500 px-1.5 text-xs font-semibold text-white">
          {{ heldCount() }}
        </span>
      }
    </button>
  </div>

  @if (holdError(); as message) {
    <div class="mb-2 shrink-0 rounded-lg border border-red-100 bg-red-50 px-3 py-2 text-base text-red-700">
      {{ message }}
    </div>
  }

  <div class="flex min-h-0 flex-1 gap-4">
    <app-product-catalog
      class="flex min-h-0 min-w-0 flex-1 flex-col"
      (addProduct)="addProduct($event)"
    />

    <app-sale-ticket
      class="flex min-h-0 w-[380px] shrink-0 flex-col"
      [items]="items()"
      [customer]="customer()"
      [subtotal]="subtotal()"
      [taxes]="taxes()"
      [total]="total()"
      [canCheckout]="canCheckout()"
      (increment)="increment($event)"
      (decrement)="decrement($event)"
      (remove)="remove($event)"
      (checkout)="checkout()"
      (hold)="hold()"
      (clearSale)="clearSale()"
      (changeCustomer)="changeCustomer($event)"
    />
  </div>
</div>

<app-payment-modal
  [(open)]="paymentOpen"
  [lines]="paymentLines()"
  [customer]="paymentCustomer()"
  [resumeSaleId]="resumeSaleId()"
  (confirmed)="onSaleConfirmed($event)"
  (cancelled)="paymentOpen.set(false)"
/>

<app-held-sales-panel
  [(open)]="heldPanelOpen"
  [refresh]="heldRefresh()"
  (charge)="onCharge($event)"
  (changed)="onHeldChanged()"
/>
