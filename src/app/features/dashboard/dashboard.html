<!-- Barra superior: selector de período -->
<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div class="inline-flex rounded-lg border border-gray-200 bg-white p-0.5 shadow-sm">
    @for (option of periodOptions; track option.value) {
      <button
        type="button"
        (click)="onPeriodChange(option.value)"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors"
        [class]="
          period() === option.value
            ? 'bg-blue-600 text-white'
            : 'text-gray-600 hover:bg-gray-50'
        "
      >
        {{ option.label }}
      </button>
    }
  </div>

  @if (period() === 'custom') {
    <div class="flex items-center gap-2">
      <input
        type="date"
        [value]="fromDate()"
        (change)="onFromChange($any($event.target).value)"
        class="rounded-lg border border-gray-200 px-2.5 py-1.5 text-sm text-gray-700 focus:border-blue-500 focus:outline-none"
      />
      <span class="text-sm text-gray-500">a</span>
      <input
        type="date"
        [value]="toDate()"
        (change)="onToChange($any($event.target).value)"
        class="rounded-lg border border-gray-200 px-2.5 py-1.5 text-sm text-gray-700 focus:border-blue-500 focus:outline-none"
      />
    </div>
  }

  @if (loading()) {
    <span class="text-sm text-gray-500">Cargando…</span>
  }
</div>

@if (error()) {
  <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ error() }}
  </div>
}

<div class="grid grid-cols-12 gap-4">
  <!-- Columna principal: KPIs + gráfica de ventas + donas -->
  <div class="col-span-9 space-y-4">
    <div class="grid grid-cols-4 gap-4">
      @for (card of kpiCards(); track card.label) {
        <app-stat-card [data]="card" />
      }
    </div>

    <div class="grid grid-cols-3 items-stretch gap-4">
      <app-sales-by-day-chart class="col-span-2" [data]="salesByDay()" />

      <div class="space-y-4">
        <app-sales-donut-card title="Ventas por método de pago" [items]="salesByPaymentMethod()" />
        <app-sales-donut-card title="Ventas por categoría" [items]="salesByCategory()" />
      </div>
    </div>
  </div>

  <!-- Columna derecha: alertas -->
  <app-alerts-panel class="col-span-3" [alerts]="stockAlerts()" [totalAlerts]="totalAlerts()" />

  <!-- Fila inferior: productos + inventario/kardex -->
  <app-products-table-card class="col-span-7" [products]="productRows()" />

  <div class="col-span-5 space-y-4">
    <app-inventory-summary [summary]="inventorySummary()" />
    <app-kardex-card [movements]="kardexMovements()" />
  </div>
</div>
