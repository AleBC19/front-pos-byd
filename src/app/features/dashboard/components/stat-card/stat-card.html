<div class="flex items-start gap-3 rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
  <span
    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-white"
    [class]="colorClass()"
  >
    <svg
      class="h-6 w-6"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path [attr.d]="iconPath()" />
    </svg>
  </span>

  <div class="min-w-0">
    <p class="text-xs text-gray-500">{{ data().label }}</p>
    <p class="text-2xl font-bold text-gray-900">{{ data().value }}</p>
    <p class="mt-0.5 flex items-center gap-1 text-[11px]">
      <span class="flex items-center font-semibold text-green-600">
        <svg
          class="h-3 w-3"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 19.5v-15m0 0-6.75 6.75M12 4.5l6.75 6.75" />
        </svg>
        {{ data().changePercent }}
      </span>
      <span class="text-gray-500">vs ayer {{ data().previousValue }}</span>
    </p>
  </div>
</div>
